version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: argus-db
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus_password
      POSTGRES_DB: argus_db
    ports:
      - "5432:5432"
    volumes:
      - argus_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  argus_postgres_data:
