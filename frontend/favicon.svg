<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 80 432 352">
  <defs>
    <linearGradient id="eyeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" /> <!-- Tailwind green-400 -->
      <stop offset="100%" stop-color="#06b6d4" /> <!-- Tailwind cyan-500 -->
    </linearGradient>
    <linearGradient id="irisGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" /> <!-- Tailwind green-500 -->
      <stop offset="100%" stop-color="#3b82f6" /> <!-- Tailwind blue-500 -->
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Tech Shield / Brackets -->
  <path d="M 140 100 L 60 256 L 140 412" fill="none" stroke="#374151" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 372 100 L 452 256 L 372 412" fill="none" stroke="#374151" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Cyber Eye Outer -->
  <path d="M 160 256 Q 256 120 352 256 Q 256 392 160 256 Z" fill="none" stroke="url(#eyeGradient)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Cyber Eye Iris -->
  <circle cx="256" cy="256" r="64" fill="none" stroke="url(#irisGradient)" stroke-width="24" filter="url(#glow)" />
  
  <!-- Pupil / Crosshair -->
  <circle cx="256" cy="256" r="24" fill="#4ade80" filter="url(#glow)" />
  
  <!-- Reticle Lines -->
  <line x1="256" y1="180" x2="256" y2="200" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" />
  <line x1="256" y1="332" x2="256" y2="312" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" />
  <line x1="180" y1="256" x2="200" y2="256" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" />
  <line x1="332" y1="256" x2="312" y2="256" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" />
</svg>
