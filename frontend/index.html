<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Argus</title>
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            cocoa: "#200f0a",
                            plum: "#2b2538",
                            aubergine: "#4d3f3b",
                            cream: "#fcfaf9",
                            sand: "#e3ccc0",
                            stone: "#a69f9d",
                            mint: "#a2f6f5",
                            iris: "#858df9",
                            periwinkle: "#6c74df",
                            lavender: "#b6bbfb",
                            danger: "#ef6a6a",
                        },
                        fontFamily: {
                            sans: ["Inter", "system-ui", "sans-serif"],
                            mono: ['"JetBrains Mono"', "monospace"],
                        },
                        borderRadius: {
                            pill: "9999px",
                        },
                        letterSpacing: {
                            mono: "0.06em",
                        },
                    },
                },
            };
        </script>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap"
            rel="stylesheet"
        />
    </head>
    <body class="bg-cocoa text-cream font-sans antialiased min-h-screen">
        <div id="app"></div>
        <script type="module" src="/src/main.js"></script>

</html>
